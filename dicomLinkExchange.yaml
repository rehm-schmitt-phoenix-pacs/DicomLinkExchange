                  mimeType: application/zip
                  description: DICOM Study as ZIP file
                  studyInstanceUID: 1.2.276.0.23.60.1.2.14841915742092284318.1713520221786.0
                  date: 20240419
                  modalities: OT
                  patientsName: Mustermann,Max
                  patientsBirthdate: 19700101
                  patientsSex: M
                  fileCount: 3
          - link: https://www.example.dlx/dlx/v1/token/DER-IV8-42X
            issuer: Example Hospital
            issuedAt: 2022-02-11T10:00:00Z
            expiresAt: 2022-03-11T10:00:00Z
            token: DER-IV8-42X
